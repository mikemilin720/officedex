<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OfficeDex Node Drawing Motion Demo</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --ink: #152033;
      --muted: #69748a;
      --line: #5f4ee8;
      --line-soft: rgba(95, 78, 232, 0.16);
      --panel: rgba(255, 255, 255, 0.92);
      --shadow: 0 24px 68px rgba(28, 38, 76, 0.16);
      --outline-ms: 900ms;
      --content-delay: 820ms;
      --char-step: 22ms;
      --char-ms: 90ms;
      --line-pause: 180ms;
      --tags-delay: 2600ms;
      --breath-delay: 3000ms;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        linear-gradient(135deg, rgba(95, 78, 232, 0.08), transparent 34%),
        radial-gradient(circle at 78% 18%, rgba(45, 176, 160, 0.12), transparent 32%),
        var(--bg);
    }

    .demo-shell {
      display: grid;
      grid-template-columns: minmax(260px, 360px) minmax(420px, 1fr);
      gap: 28px;
      width: min(1120px, calc(100vw - 48px));
      margin: 0 auto;
      padding: 42px 0;
      align-items: start;
    }

    .demo-copy {
      display: grid;
      gap: 18px;
    }

    .demo-copy h1 {
      margin: 0;
      font-size: 30px;
      line-height: 1.12;
      letter-spacing: 0;
    }

    .demo-copy p {
      margin: 0;
      color: var(--muted);
      line-height: 1.65;
      font-size: 15px;
    }

    .controls {
      display: grid;
      gap: 12px;
      padding: 16px;
      border: 1px solid rgba(35, 48, 80, 0.10);
      border-radius: 14px;
      background: var(--panel);
      box-shadow: 0 12px 34px rgba(28, 38, 76, 0.08);
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    button {
      height: 36px;
      padding: 0 13px;
      border: 1px solid rgba(35, 48, 80, 0.16);
      border-radius: 8px;
      color: var(--ink);
      background: #fff;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
    }

    button.primary {
      color: #fff;
      border-color: var(--line);
      background: var(--line);
    }

    button.is-active {
      border-color: var(--line);
      color: var(--line);
      background: rgba(95, 78, 232, 0.08);
    }

    .stage {
      min-height: 650px;
      padding: 28px;
      border: 1px solid rgba(35, 48, 80, 0.10);
      border-radius: 18px;
      background:
        linear-gradient(rgba(255, 255, 255, 0.82), rgba(255, 255, 255, 0.82)),
        linear-gradient(90deg, rgba(95, 78, 232, 0.08) 1px, transparent 1px),
        linear-gradient(rgba(95, 78, 232, 0.08) 1px, transparent 1px);
      background-size: auto, 28px 28px, 28px 28px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .stage-title {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 28px;
      color: var(--muted);
      font-size: 13px;
    }

    .flow-preview {
      position: relative;
      display: grid;
      grid-template-columns: 180px 360px;
      gap: 54px;
      align-items: center;
      min-height: 500px;
    }

    .idea-node {
      position: relative;
      width: 180px;
      padding: 18px;
      border: 1px solid rgba(95, 78, 232, 0.28);
      border-radius: 14px;
      background: #fff;
      box-shadow: 0 16px 38px rgba(95, 78, 232, 0.10);
    }

    .idea-node span,
    .motion-node-label {
      display: block;
      color: var(--line);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .idea-node strong {
      display: block;
      margin-top: 8px;
      font-size: 16px;
      line-height: 1.35;
    }

    .edge {
      position: absolute;
      left: 184px;
      top: 50%;
      width: 52px;
      height: 2px;
      background: linear-gradient(90deg, rgba(95, 78, 232, 0.24), rgba(95, 78, 232, 0.68));
    }

    .motion-node {
      position: relative;
      width: 360px;
      min-height: 218px;
      padding: 22px 22px 20px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 22px 58px rgba(26, 38, 76, 0.18);
    }

    .motion-node::before {
      content: "";
      position: absolute;
      inset: -20px;
      border-radius: 30px;
      background:
        radial-gradient(circle at 50% 50%, rgba(95, 78, 232, 0.20), transparent 56%),
        linear-gradient(90deg, rgba(95, 78, 232, 0.14), rgba(45, 176, 160, 0.10), transparent);
      opacity: 0;
      transform: scale(0.96);
      animation: nodeBreath 1800ms ease-in-out var(--breath-delay) infinite both;
    }

    .node-outline {
      position: absolute;
      z-index: 2;
      inset: -4px;
      width: calc(100% + 8px);
      height: calc(100% + 8px);
      overflow: visible;
      pointer-events: none;
    }

    .node-outline path {
      fill: none;
      stroke: var(--line);
      stroke-width: 2.6;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
      pathLength: 100;
      stroke-dasharray: 100;
      stroke-dashoffset: 100;
      filter: drop-shadow(0 0 8px rgba(95, 78, 232, 0.30));
      animation: outlineDraw var(--outline-ms) cubic-bezier(0.22, 0.86, 0.22, 1) both;
    }

    .pen-tip {
      position: absolute;
      z-index: 4;
      left: -4px;
      top: -4px;
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: #fff;
      border: 2px solid var(--line);
      box-shadow: 0 0 0 6px rgba(95, 78, 232, 0.14), 0 0 18px rgba(95, 78, 232, 0.50);
      offset-path: path("M 22 2 H 338 Q 358 2 358 22 V 220 Q 358 240 338 240 H 22 Q 2 240 2 220 V 22 Q 2 2 22 2");
      offset-distance: 0%;
      animation: penMove var(--outline-ms) cubic-bezier(0.22, 0.86, 0.22, 1) both;
    }

    .motion-node-content {
      position: relative;
      z-index: 5;
      display: grid;
      gap: 10px;
    }

    .line,
    .motion-node-label {
      --line-index: 0;
      --line-delay: var(--content-delay);
      --line-duration: 420ms;
      white-space: pre-wrap;
    }

    .line {
      display: block;
      line-height: 1.42;
    }

    .line::after,
    .motion-node-label::after {
      content: "";
      display: inline-block;
      width: 2px;
      height: 1.04em;
      margin-left: 3px;
      border-radius: 2px;
      background: var(--line);
      opacity: 0;
      vertical-align: -0.16em;
      animation: none;
    }

    .line.is-streaming::after,
    .motion-node-label.is-streaming::after {
      opacity: 1;
      animation: caretBlink 720ms steps(1, end) infinite;
    }

    .line.title {
      margin-top: 4px;
      font-size: 20px;
      font-weight: 760;
    }

    .line.summary {
      color: #43506a;
      font-size: 14px;
    }

    .line.small {
      color: #5c6880;
      font-size: 13px;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding-top: 6px;
    }

    .tag {
      opacity: 0;
      transform: translateY(6px);
      padding: 4px 8px;
      border-radius: 999px;
      color: #4a3fd2;
      background: rgba(95, 78, 232, 0.10);
      font-size: 12px;
      animation: tagIn 280ms ease-out both;
      animation-delay: var(--tags-delay);
    }

    .demo-shell.speed-fast {
      --outline-ms: 680ms;
      --content-delay: 600ms;
      --char-step: 15ms;
      --char-ms: 70ms;
      --line-pause: 130ms;
    }

    .demo-shell.speed-slow {
      --outline-ms: 1180ms;
      --content-delay: 1080ms;
      --char-step: 30ms;
      --char-ms: 120ms;
      --line-pause: 240ms;
    }

    .demo-shell.is-replaying .motion-node,
    .demo-shell.is-replaying .motion-node::before,
    .demo-shell.is-replaying .line::after,
    .demo-shell.is-replaying .motion-node-label::after,
    .demo-shell.is-replaying .node-outline path,
    .demo-shell.is-replaying .pen-tip,
    .demo-shell.is-replaying .tag {
      animation: none !important;
    }

    @keyframes outlineDraw {
      0% {
        opacity: 0.45;
        stroke-dashoffset: 100;
      }

      12% {
        opacity: 1;
      }

      100% {
        opacity: 1;
        stroke-dashoffset: 0;
      }
    }

    @keyframes penMove {
      0% {
        opacity: 0;
        offset-distance: 0%;
        transform: scale(0.8);
      }

      10% {
        opacity: 1;
      }

      96% {
        opacity: 1;
      }

      100% {
        opacity: 0;
        offset-distance: 100%;
        transform: scale(1);
      }
    }

    @keyframes caretBlink {
      0% {
        opacity: 1;
      }

      48% {
        opacity: 1;
      }

      50% {
        opacity: 0;
      }

      100% {
        opacity: 0;
      }
    }

    @keyframes tagIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes nodeBreath {
      0% {
        opacity: 0.16;
        transform: scale(1);
      }

      50% {
        opacity: 0.52;
        transform: scale(1.035);
      }

      100% {
        opacity: 0.16;
        transform: scale(1);
      }
    }

    @media (max-width: 860px) {
      .demo-shell {
        grid-template-columns: 1fr;
      }

      .flow-preview {
        grid-template-columns: 1fr;
        gap: 22px;
      }

      .edge {
        display: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .node-outline path,
      .pen-tip,
      .motion-node::before,
      .line::after,
      .motion-node-label::after,
      .tag {
        animation: none !important;
        opacity: 1 !important;
        transform: none !important;
        stroke-dashoffset: 0 !important;
      }

      .line::after,
      .motion-node-label::after {
        opacity: 0 !important;
      }
    }
  </style>
</head>
<body>
  <main class="demo-shell speed-normal" id="demo">
    <section class="demo-copy">
      <div>
        <h1>节点生成动画 Demo</h1>
        <p>观察重点：轮廓从左上角起笔，沿上边、右边、下边、左边顺时针画完；随后节点内容像 AI 对话流式输出一样，一行完成后再生成下一行。呼吸光效只在全部内容生成后出现。</p>
      </div>
      <div class="controls">
        <div class="button-row">
          <button class="primary" id="replay" type="button">Replay</button>
          <button class="speed" data-speed="speed-fast" type="button">快</button>
          <button class="speed is-active" data-speed="speed-normal" type="button">标准</button>
          <button class="speed" data-speed="speed-slow" type="button">慢</button>
        </div>
        <p>如果你仍然觉得顺时针不明显，可以把发光笔尖同步迁回 app 里；如果觉得太强，也可以只保留轮廓线。</p>
      </div>
    </section>

    <section class="stage">
      <div class="stage-title">
        <span>Living Tree Node Motion</span>
        <span>outline -> text lines -> characters</span>
      </div>

      <div class="flow-preview">
        <div class="idea-node">
          <span>Idea</span>
          <strong>我想讲清楚为什么我们要重做内部知识库</strong>
        </div>
        <div class="edge"></div>

        <article class="motion-node" aria-label="Story Beat node">
          <svg class="node-outline" viewBox="0 0 360 242" preserveAspectRatio="none" aria-hidden="true">
            <path pathLength="100" d="M 22 2 H 338 Q 358 2 358 22 V 220 Q 358 240 338 240 H 22 Q 2 240 2 220 V 22 Q 2 2 22 2" />
          </svg>
          <span class="pen-tip" aria-hidden="true"></span>

          <div class="motion-node-content">
            <span class="motion-node-label" data-text="Story Beat"></span>
            <strong class="line title" data-text="现状：知识分散正在拖慢决策"></strong>
            <span class="line summary" data-text="把知识入口分散造成的决策摩擦，用一个具体工作场景讲清楚。"></span>
            <span class="line small" data-text="确认后，它会被用于生成下一层 Chapter。"></span>
            <div class="tags">
              <span class="tag">待确认</span>
              <span class="tag">生成中</span>
            </div>
          </div>
        </article>
      </div>
    </section>
  </main>

  <script>
    const demo = document.getElementById("demo");
    const replay = document.getElementById("replay");
    const speedButtons = Array.from(document.querySelectorAll(".speed"));
    let streamTimers = [];

    function parseMs(value) {
      const text = String(value || "").trim();
      if (text.endsWith("ms")) return Number.parseFloat(text);
      if (text.endsWith("s")) return Number.parseFloat(text) * 1000;
      return Number.parseFloat(text) || 0;
    }

    function schedule(callback, delay) {
      const timer = window.setTimeout(callback, delay);
      streamTimers.push(timer);
      return timer;
    }

    function clearStreamTimers() {
      streamTimers.forEach((timer) => window.clearTimeout(timer));
      streamTimers = [];
    }

    function prepareText() {
      clearStreamTimers();
      const lines = Array.from(document.querySelectorAll("[data-text]"));
      lines.forEach((line, lineIndex) => {
        line.style.setProperty("--line-index", lineIndex);
        line.textContent = "";
        line.classList.remove("is-streaming", "is-complete");
      });
      configureTimings();
    }

    function configureTimings() {
      const style = window.getComputedStyle(demo);
      const contentDelay = parseMs(style.getPropertyValue("--content-delay"));
      const charStep = parseMs(style.getPropertyValue("--char-step"));
      const charMs = parseMs(style.getPropertyValue("--char-ms"));
      const linePause = parseMs(style.getPropertyValue("--line-pause"));
      const lines = Array.from(document.querySelectorAll("[data-text]"));
      let cursor = contentDelay;

      lines.forEach((line) => {
        const length = Array.from(line.getAttribute("data-text") || "").length;
        const duration = Math.max(180, (Math.max(1, length) - 1) * charStep + charMs);
        line.style.setProperty("--line-delay", `${Math.round(cursor)}ms`);
        line.style.setProperty("--line-duration", `${Math.round(duration)}ms`);
        cursor += duration + linePause;
      });

      demo.style.setProperty("--tags-delay", `${Math.round(cursor + 80)}ms`);
      demo.style.setProperty("--breath-delay", `${Math.round(cursor + 520)}ms`);
    }

    function streamLine(line, chars, charStep) {
      line.classList.add("is-streaming");
      line.textContent = "";

      chars.forEach((char, charIndex) => {
        schedule(() => {
          line.textContent += char;
          if (charIndex === chars.length - 1) {
            schedule(() => {
              line.classList.remove("is-streaming");
              line.classList.add("is-complete");
            }, Math.max(90, charStep * 1.4));
          }
        }, charIndex * charStep);
      });
    }

    function startTextStream() {
      const style = window.getComputedStyle(demo);
      const contentDelay = parseMs(style.getPropertyValue("--content-delay"));
      const charStep = parseMs(style.getPropertyValue("--char-step"));
      const charMs = parseMs(style.getPropertyValue("--char-ms"));
      const linePause = parseMs(style.getPropertyValue("--line-pause"));
      const lines = Array.from(document.querySelectorAll("[data-text]"));
      let cursor = contentDelay;

      lines.forEach((line) => {
        const chars = Array.from(line.getAttribute("data-text") || "");
        const duration = Math.max(180, (Math.max(1, chars.length) - 1) * charStep + charMs);
        schedule(() => streamLine(line, chars, charStep), cursor);
        cursor += duration + linePause;
      });
    }

    function restart() {
      prepareText();
      demo.classList.add("is-replaying");
      window.requestAnimationFrame(() => {
        window.requestAnimationFrame(() => {
          demo.classList.remove("is-replaying");
          startTextStream();
        });
      });
    }

    replay.addEventListener("click", restart);
    speedButtons.forEach((button) => {
      button.addEventListener("click", () => {
        speedButtons.forEach((candidate) => candidate.classList.remove("is-active"));
        button.classList.add("is-active");
        demo.classList.remove("speed-fast", "speed-normal", "speed-slow");
        demo.classList.add(button.dataset.speed);
        restart();
      });
    });

    restart();
  </script>
</body>
</html>
